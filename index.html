<!DOCTYPE html>
<html lang="es" class="dark-mode" style="background-color: #000000; color: #ffffff;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Chat Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260722">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="chat-container locked" id="chatContainer">
        <div class="chat-header">
            <button id="adminToggle">🔑</button>
            <span>Supabase Chat Pro</span>
            <div class="header-actions">
                <button id="adminResetPwBtn" title="Resetear contraseña de otro usuario" class="super-admin-only" style="display:none;">🔑👤</button>
                <button id="dmToggle" title="Mensajes privados" style="display:none;">💬</button>
                <button id="gameToggle" title="Juegos">🎮</button>
                <button id="musicToggle" title="Radio / Música">🎵</button>
                <button id="themeToggle">☀️</button>
                <button id="hideChatBtn" title="Ocultar chat">🙈</button>
            </div>
        </div>

        <!-- BARRA DE REPRODUCCIÓN PERSISTENTE (solo aparece cuando hay una estación sonando) -->
        <div class="music-player-bar" id="musicPlayerBar" style="display: none;">
            <button id="prevTrackBtn" title="Anterior">⏮</button>
            <button id="playPauseBtn">▶</button>
            <button id="nextTrackBtn" title="Siguiente">⏭</button>
            <button id="shuffleBtn" title="Aleatorio">🔀</button>
            <button id="repeatBtn" title="Repetir">🔁</button>
            <span class="current-track" id="currentTrackTitle"><span id="currentTrackTitleInner">Ninguna estación seleccionada</span></span>
            <div class="volume-control">
                <button id="muteBtn" title="Silenciar">🔊</button>
                <input type="range" id="volumeSlider" min="0" max="100" value="80" title="Volumen">
            </div>
            <audio id="audioPlayer"></audio>
        </div>

        <!-- BARRA DE PROGRESO: tiempo actual / duración, con arrastre para
             saltar al segundo exacto. Solo tiene sentido para pistas con
             duración finita (canciones y "Mi música"); en radio en vivo
             (duración = Infinity) se oculta, ya que no hay un punto fijo
             al que saltar. -->
        <div class="music-progress-bar" id="musicProgressBar" style="display: none;">
            <span class="progress-time" id="progressCurrentTime">0:00</span>
            <input type="range" id="progressSlider" min="0" max="100" value="0" step="1">
            <span class="progress-time" id="progressDuration">0:00</span>
        </div>

        <!-- PANEL DESPLEGABLE DE BÚSQUEDA (se cierra automáticamente al elegir una estación/canción) -->
        <div class="music-panel" id="musicPanel">
            <div class="music-tabs">
                <button class="music-tab active" id="tabRadio" data-mode="radio">📻 Radio en vivo</button>
                <button class="music-tab" id="tabShared" data-mode="shared">🌐 Música compartida</button>
                <button class="music-tab" id="tabUploads" data-mode="uploads">📤 Mi música</button>
            </div>
            <div class="music-search-row" id="musicSearchRow">
                <input type="text" id="musicInput" placeholder="Buscar estación de radio (ej. rock, jazz, noticias)...">
                <button id="searchMusicBtn">Buscar</button>
            </div>
            <div class="music-upload-row" id="musicUploadRow">
                <label for="uploadMusicInput" class="music-upload-label">⬆️ Subir canción (mp3, wav, ogg...)</label>
                <input type="file" id="uploadMusicInput" accept="audio/*" multiple style="display: none;">
                <input type="text" id="albumInput" class="album-input" list="albumSuggestions" placeholder="Álbum/carpeta (opcional)">
                <datalist id="albumSuggestions"></datalist>
            </div>
            <p class="music-hint" id="musicHint"></p>
            <div class="radio-results" id="radioResults"></div>
        </div>

        <!-- PANEL DE JUEGOS (iframe embebido, se cierra al elegir otro juego o cerrar) -->
        <div class="game-panel" id="gamePanel" style="display:none;">
            <div class="game-panel-header">
                <span class="game-panel-title" id="gamePanelTitle">🎮 Juegos</span>
                <button id="gamePanelClose" title="Cerrar">✕</button>
            </div>
            <div class="game-list" id="gameList"></div>
            <div class="game-frame-wrap" id="gameFrameWrap" style="display:none;">
                <iframe id="gameFrame" src="" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <!-- BARRA PARA CARGAR MENSAJES ANTERIORES (visible cuando hay más historial disponible) -->
        <button class="load-more-bar" id="loadMoreBar" style="display: none;">Cargar mensajes anteriores ↑</button>

        <div class="chat-messages" id="chatMessages"></div>
        <div class="preview-container" id="previewContainer" style="display: none;"></div>

        <!-- PANEL DE EMOJIS / STICKERS / GIFS PARA COMPONER MENSAJES -->
        <div class="media-panel" id="mediaPanel">
            <div class="media-tabs">
                <button class="media-tab active" id="tabEmoji" data-mode="emoji">😀 Emojis</button>
                <button class="media-tab" id="tabSticker" data-mode="sticker">🧩 Stickers</button>
                <button class="media-tab" id="tabGif" data-mode="gif">🎞️ GIFs</button>
            </div>
            <div class="media-search-row" id="gifSearchRow" style="display: none;">
                <input type="text" id="gifInput" placeholder="Buscar GIF...">
                <button id="searchGifBtn">Buscar</button>
            </div>
            <div class="media-grid" id="mediaGrid"></div>
        </div>

        <form class="chat-form" id="chatForm" onsubmit="return false;">
            <label for="fileInput" class="file-label">➕</label>
            <button type="button" id="emojiToggle" class="emoji-toggle-btn" title="Emojis, stickers y GIFs">😀</button>
            <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display: none;">
            <textarea id="msgInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
            <button id="guestLoginBtn" type="button" title="Inicia sesión para chatear" style="display:none;">🔓</button>
            <button id="sendBtn" type="button">Enviar</button>
        </form>

        <!-- PANEL DE MENSAJES PRIVADOS 1 a 1 (requiere haber iniciado sesión con
             una cuenta personal, no disponible en modo Invitado) -->
        <div class="dm-panel" id="dmPanel" style="display:none;">
            <div class="dm-header">
                <button id="dmBackBtn" class="dm-back-btn" style="display:none;">←</button>
                <span class="dm-title" id="dmTitle">Mensajes privados</span>
                <button id="dmCloseBtn" class="dm-close-btn">✕</button>
            </div>

            <!-- Vista: buscador de usuarios + lista de conversaciones existentes -->
            <div class="dm-list-view" id="dmListView">
                <div class="dm-search-row">
                    <input type="text" id="dmSearchInput" placeholder="Buscar usuario...">
                    <button id="dmSearchBtn">Buscar</button>
                </div>
                <div class="dm-results" id="dmResults"></div>
                <p class="dm-section-label">Tus conversaciones</p>
                <div class="dm-conversations" id="dmConversations"></div>
            </div>

            <!-- Vista: conversación abierta con una persona -->
            <div class="dm-chat-view" id="dmChatView" style="display:none;">
                <div class="dm-messages" id="dmMessages"></div>
                <form class="dm-form" id="dmForm" onsubmit="return false;">
                    <textarea id="dmMsgInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
                    <button id="dmSendBtn" type="button">Enviar</button>
                </form>
            </div>
        </div>

        <!-- PANTALLA DE BLOQUEO: modo Invitado (solo ver, contraseña compartida) vs
             Mi cuenta (usuario+contraseña personal via Supabase Auth, permite chatear) -->
        <div class="lock-overlay" id="lockOverlay" style="display: flex;">
            <div class="lock-box">
                <div class="lock-icon">🔒</div>
                <p class="lock-title">Chat protegido</p>

                <div class="lock-tabs">
                    <button class="lock-tab active" id="lockTabGuest" data-mode="guest">👀 Invitado</button>
                    <button class="lock-tab" id="lockTabAccount" data-mode="account">👤 Mi cuenta</button>
                </div>

                <!-- INVITADO: solo puede ver el chat, no puede escribir -->
                <form id="lockForm" onsubmit="return false;">
                    <input type="password" id="lockPasswordInput" placeholder="Contraseña" autocomplete="current-password">
                    <button id="lockSubmitBtn" type="button">Entrar como invitado</button>
                </form>

                <!-- CUENTA: login personal, habilita el chat -->
                <form id="accountForm" style="display:none;" onsubmit="return false;">
                    <input type="text" id="accountUsernameInput" placeholder="Usuario" autocomplete="username">
                    <input type="password" id="accountPasswordInput" placeholder="Contraseña" autocomplete="current-password">
                    <button id="accountLoginBtn" type="button">Entrar</button>
                    <p class="lock-switch" id="showRegisterLink">¿No tienes cuenta? Regístrate</p>
                </form>

                <!-- REGISTRO -->
                <form id="registerForm" style="display:none;" onsubmit="return false;">
                    <input type="text" id="registerUsernameInput" placeholder="Elige un usuario" autocomplete="username">
                    <input type="password" id="registerPasswordInput" placeholder="Elige una contraseña" autocomplete="new-password">
                    <button id="registerBtn" type="button">Crear cuenta</button>
                    <p class="lock-switch" id="showLoginLink">Ya tengo cuenta</p>
                </form>

                <p class="lock-error" id="lockError" style="display: none;"></p>
            </div>
        </div>
    </div>

    <!-- MODAL LIGHTBOX PARA VISUALIZAR IMÁGENES -->
    <div class="lightbox" id="lightboxModal">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img class="lightbox-content" id="lightboxImg" src="" alt="">
        <span class="lightbox-hint">Rueda del mouse: zoom · Arrastrar: mover</span>
    </div>

    <!-- CONTROL FLOTANTE DE BRILLO RÁPIDO: baja el brillo de TODA la página
         (filtro CSS, no un overlay que tapa) para que se vea más discreta
         sin dejar de ser legible. Vive fuera del chat, siempre visible. -->
    <div class="floating-dim-controls">
        <button id="dimToggleBtn" class="floating-dim-btn" title="Bajar brillo de la página">🌙</button>
        <input type="range" id="dimIntensitySlider" min="20" max="100" value="45" title="Nivel de brillo">
    </div>

    <script src="js/passwords.js?v=20260722"></script>
    <script src="js/games.js?v=20260722"></script>
    <script src="js/config.js?v=20260722"></script>
    <script src="js/auth.js?v=20260722"></script>
    <script src="js/lock.js?v=20260722"></script>
    <script src="js/ui.js?v=20260722"></script>
    <script src="js/music.js?v=20260722"></script>
    <script src="js/chat.js?v=20260722"></script>
    <script src="js/dm.js?v=20260722"></script>
    <script src="js/media-picker.js?v=20260722"></script>
</body>

</html>
